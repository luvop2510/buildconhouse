name: Pre-deployment Gate

on:
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF visual regression renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Backend tests and dependency audit
        working-directory: backend
        # Unit tests stay hermetic; production secrets are used only by the
        # explicit read-only gate below.
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: forge_predeploy_unit_tests
          JWT_SECRET: predeploy-unit-test-secret-not-a-real-secret-32chars
          JWT_ALGORITHM: HS256
          JWT_EXP_MINUTES: "43200"
          MEDIA_STORAGE_DRIVER: supabase
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
          SUPABASE_ANON_KEY: ci-placeholder-not-real
          SUPABASE_PUBLIC_BUCKET: forge-products
          SUPABASE_PRIVATE_BUCKET: forge-private
          FORGE_ALLOW_DEMO_SEED: "false"
          ENVIRONMENT: production
        run: |
          pip install -r requirements-prod.txt pip-audit pytest pytest-asyncio
          pip-audit -r requirements-prod.txt
          python -m pytest tests/unit -q
      - name: Frontend checks, tests, build and bundle budget
        working-directory: .
        env:
          BACKEND_URL: https://forge20-production.up.railway.app
        run: |
          npm ci
          node scripts/check-npm-audit.mjs
          npx tsc --noEmit
          npx expo lint -- --max-warnings 0
          npm run test:quotation-media && npm run test:downloads && npm run test:quotation-contract && npm run test:quotation-concealed-parts && npm run test:purchases-contract && npm run test:notebook && npm run test:mobile-ux && npm run test:api-client && npm run test:api-proxy && npm run test:sales-periods && npm run test:monitoring-contract && npm run test:frontend-performance && npm run test:icon-fonts && npm run test:web-worker && node scripts/verify-tile-orders-contract.mjs
          npm run build
          npm run test:mobile-budget
      - name: Live MongoDB, Supabase and required-index check (read-only)
        working-directory: backend
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLIC_BUCKET: forge-products
          SUPABASE_PRIVATE_BUCKET: forge-private
          MEDIA_STORAGE_DRIVER: supabase
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENVIRONMENT: production
        run: |
          python scripts/predeploy_backend_gate.py
          python scripts/predeploy_media_integrity.py --page-size 100 --delay-seconds 0.05
