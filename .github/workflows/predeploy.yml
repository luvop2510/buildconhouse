name: Pre-deployment Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF visual regression renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Backend tests and dependency audit
        working-directory: backend
        # Unit tests stay hermetic; production secrets are used only by the
        # explicit read-only gate below.
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: forge_predeploy_unit_tests
          JWT_SECRET: predeploy-unit-test-secret-not-a-real-secret-32chars
          JWT_ALGORITHM: HS256
          JWT_EXP_MINUTES: "43200"
          MEDIA_STORAGE_DRIVER: supabase
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
          SUPABASE_ANON_KEY: ci-placeholder-not-real
          SUPABASE_PUBLIC_BUCKET: forge-products
          SUPABASE_PRIVATE_BUCKET: forge-private
          FORGE_ALLOW_DEMO_SEED: "false"
          ENVIRONMENT: production
        run: |
          python -m pip install --upgrade pip==26.2.2
          pip install -r requirements-prod.txt pip-audit pytest pytest-asyncio
          pip-audit -r requirements-prod.txt
          python -m pytest tests/unit -q
      - name: Frontend checks, tests, build and bundle budget
        working-directory: .
        env:
          BACKEND_URL: https://forge20-production-a8b0.up.railway.app
        run: |
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
          npm run prepare:dependencies
          node scripts/check-npm-audit.mjs
          npx tsc --noEmit
          npx expo lint -- --max-warnings 0
          npm run test:customer-draft-reset
          npm run test:team-contacts
          npm run test:quotation-whatsapp
          npm run test:release-stability
          node scripts/test-r2-media-worker.mjs
          node scripts/test-tiles-loading.mjs
          npm run test:quotation-media && npm run test:downloads && npm run test:quotation-contract && npm run test:quotation-concealed-parts && npm run test:purchases-contract && npm run test:notebook && npm run test:mobile-ux && npm run test:api-client && npm run test:api-proxy && npm run test:sales-periods && npm run test:monitoring-contract && npm run test:frontend-performance && npm run test:icon-fonts && npm run test:release-recovery && npm run test:web-worker && node scripts/verify-tile-orders-contract.mjs
          npm run build
          npm run test:mobile-budget
      - name: Install release stability browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Every-route and populated-response runtime acceptance
        run: npm run test:e2e:stability
      - name: Preserve release stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-stability
          path: output/playwright
          if-no-files-found: error
          retention-days: 3
      - name: Live MongoDB, configured storage and required-index check (read-only)
        working-directory: backend
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLIC_BUCKET: forge-products
          SUPABASE_PRIVATE_BUCKET: forge-private
          MEDIA_STORAGE_DRIVER: ${{ vars.MEDIA_STORAGE_DRIVER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENVIRONMENT: production
        run: |
          case "$MEDIA_STORAGE_DRIVER" in
            supabase|r2) ;;
            *) echo "::error::Set production MEDIA_STORAGE_DRIVER to supabase or r2."; exit 1 ;;
          esac
          python scripts/predeploy_backend_gate.py
          python scripts/predeploy_media_integrity.py --page-size 100 --delay-seconds 0.05
