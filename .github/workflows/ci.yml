name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cover feature branches; main pushes validate the merged result.
# Avoid running the same feature commit twice, and replace stale runs when a
# newer commit arrives. All three required jobs still run for each PR revision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF visual regression renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install runtime dependencies
        run: pip install -r requirements-prod.txt pyflakes pytest pytest-asyncio
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements-prod.txt
      - name: Lint (pyflakes)
        run: |
          python -m pyflakes routes/*.py services/*.py catalog_pipeline/*.py migrations/*.py \
            auth.py models.py server.py seed.py settings.py bootstrap.py db.py \
            | grep -v "imported but unused" | grep -v "assigned to but never used" > pyflakes.out || true
          if [ -s pyflakes.out ]; then cat pyflakes.out; exit 1; fi
      - name: Static analysis (compile check)
        run: python -m compileall -q routes services catalog_pipeline migrations scripts *.py
      - name: Unit tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: forge_ci_unit_tests
          JWT_SECRET: ci-unit-test-secret-not-a-real-secret-32chars
          JWT_ALGORITHM: HS256
          JWT_EXP_MINUTES: "43200"
          MEDIA_STORAGE_DRIVER: supabase
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
          SUPABASE_ANON_KEY: ci-placeholder-not-real
          SUPABASE_PUBLIC_BUCKET: forge-products
          SUPABASE_PRIVATE_BUCKET: forge-private
          FORGE_ALLOW_DEMO_SEED: "false"
          ENVIRONMENT: production
        run: python -m pytest tests/unit -v
      # Integration tests (tests/integration/) intentionally NOT run here —
      # see tests/INTEGRATION_TESTING_STRATEGY.md: they need a live deployed
      # backend + real credentials, never the shared production Atlas cluster.
      - name: Docker build
        run: docker build -t buildcon-backend .
        working-directory: backend
      - name: Import the built backend image with isolated runtime settings
        run: |
          docker run --rm --entrypoint python \
            -e MONGO_URL=mongodb://127.0.0.1:1 \
            -e DB_NAME=forge_ci_image_import \
            -e JWT_SECRET=ci-image-import-secret-not-real-32characters \
            -e JWT_ALGORITHM=HS256 -e JWT_EXP_MINUTES=60 \
            -e MEDIA_STORAGE_DRIVER=supabase \
            -e SUPABASE_URL=https://ci-placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-not-real \
            -e SUPABASE_ANON_KEY=ci-placeholder-not-real \
            -e SUPABASE_PUBLIC_BUCKET=forge-products \
            -e SUPABASE_PRIVATE_BUCKET=forge-private \
            -e FORGE_ALLOW_DEMO_SEED=false -e ENVIRONMENT=production \
            -e PYTHON_DOTENV_DISABLED=1 \
            buildcon-backend -c "from server import app; assert callable(app)"

  kitchen-persistence:
    runs-on: ubuntu-latest
    services:
      kitchen-mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHON_DOTENV_DISABLED: "1"
      KITCHEN_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: forge_ci_kitchen_tests
      JWT_SECRET: ci-kitchen-test-secret-not-a-real-secret-32chars
      JWT_ALGORITHM: HS256
      JWT_EXP_MINUTES: "60"
      MEDIA_STORAGE_DRIVER: supabase
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-real
      SUPABASE_ANON_KEY: ci-placeholder-not-real
      SUPABASE_PUBLIC_BUCKET: forge-products
      SUPABASE_PRIVATE_BUCKET: forge-private
      FORGE_ALLOW_DEMO_SEED: "false"
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing backend and test dependencies
        run: pip install -r requirements-prod.txt pytest pytest-asyncio
      # Run only the explicitly isolated suite. Historical integration files
      # require deployed services and must never join this job by a broad glob.
      - name: Verify Kitchen persistence and direct API authorization
        run: python -m pytest tests/integration/test_kitchen_projects_mongo.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install existing frontend dependencies
        working-directory: .
        run: npm ci
      - name: Install Kitchen acceptance browsers
        working-directory: .
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify exported Kitchen UI against actual API and Mongo
        working-directory: .
        env:
          FORGE_AUDIT_PYTHON: python
          EXPO_NO_DOTENV: "1"
        run: node scripts/test-kitchen-e2e.mjs
      - name: Preserve Kitchen browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-browser-acceptance
          path: |
            output/playwright/kitchen-results.json
            output/playwright/kitchen
          if-no-files-found: error
          retention-days: 3

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify audit gate failure handling
        run: node scripts/test-npm-audit.mjs
      - name: Dependency vulnerability scan (npm audit)
        run: node scripts/check-npm-audit.mjs

  # Keep this independent of frontend-security so an upstream advisory cannot
  # hide type, build or browser regressions. Both jobs are required to pass;
  # the security job has no continue-on-error or advisory suppressions.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo dependency and configuration check
        run: npx expo-doctor
      - name: Existing frontend contract tests
        run: |
          npm run test:supplier-catalog
          npm run test:catalog-pagination
          npm run test:quotation-media
          npm run test:downloads
          npm run test:quotation-contract
          npm run test:quotation-reorder
          npm run test:quotation-individual
          npm run test:multi-filters
          npm run test:section-excel
          npm run test:quotation-concealed-parts
          npm run test:purchases-contract
          npm run test:notebook
          npm run test:notebook-lifecycle
          npm run test:mobile-ux
          npm run test:kitchen-dates
          npm run test:table-layout
          npm run test:api-client
          npm run test:auth-provider-races
          npm run test:team-contacts
          npm run test:customer-draft-reset
          npm run test:quotation-whatsapp
          npm run test:furniture-rmb
          npm run test:api-proxy
          npm run test:web-worker
          node scripts/test-r2-media-worker.mjs
          node scripts/test-tiles-loading.mjs
          npm run test:sales-periods
          npm run test:monitoring-contract
          npm run test:frontend-performance
          npm run test:page-loading-performance
          npm run test:icon-fonts
          npm run test:font-assets
          npm run test:release-recovery
          npm run test:release-stability
          npm run test:npm-audit
          npm run test:shell-quote-security
          npm run test:uri-decoder-security
          npm run test:service-health
          npm run test:uptime-monitor
          npm run test:app-text
          npm run test:legal-config
          npm run test:native-permissions
          npm run test:native-release-config
          npm run test:stock-floor-races
          npm run test:history-lifecycle
          node --experimental-strip-types --no-warnings scripts/test-team-delegation.mjs
      - name: Tile Orders workflow route contract
        run: node scripts/verify-tile-orders-contract.mjs
      - name: Lint
        run: npx expo lint -- --max-warnings 0
      - name: Production web export
        env:
          BACKEND_URL: https://forge20-production-a8b0.up.railway.app
        run: npm run build
      - name: Mobile initial-JavaScript budget
        run: npm run test:mobile-budget
      - name: Install audit browsers
        id: audit-browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Release browser journeys and responsive audit
        if: ${{ !cancelled() && steps.audit-browsers.outcome == 'success' }}
        run: npm run test:e2e:audit
      - name: Populated tables across all floors and screen sizes
        if: ${{ !cancelled() && steps.audit-browsers.outcome == 'success' }}
        run: npm run test:e2e:tables
      # Once the build and browser installation pass, collect every independent
      # suite's failures in this revision instead of hiding later regressions.
      # No suite uses continue-on-error; any failed suite still fails the job.
      - name: Seven-size tablet, catalog and WhatsApp acceptance
        if: ${{ !cancelled() && steps.audit-browsers.outcome == 'success' }}
        run: npx playwright test --config playwright.responsive.config.ts responsive-
      - name: Member credentials and furniture touch-device acceptance
        if: ${{ !cancelled() && steps.audit-browsers.outcome == 'success' }}
        run: npx playwright test --config playwright.devices.config.ts
      - name: Publish browser result counts in the job summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          let summary = '### Browser acceptance evidence\n\n';
          for (const [suite, file] of Object.entries({
            audit: 'audit-results.json', responsive: 'responsive-results.json',
            devices: 'device-results.json',
            tables: 'table-results.json',
          })) {
            try {
              const { stats } = JSON.parse(await readFile(`output/playwright/${file}`, 'utf8'));
              const count = key => Number.isSafeInteger(stats?.[key]) && stats[key] >= 0 ? stats[key] : 'unavailable';
              summary += `${suite}: expected passes ${count('expected')}; unexpected failures ${count('unexpected')}; flaky ${count('flaky')}; skipped ${count('skipped')}.\n\n`;
            } catch {
              summary += `${suite}: report unavailable. Inspect its test step; acceptance remains unverified.\n\n`;
            }
          }
          summary += 'Browser checks do not certify signed native builds or physical devices. Required test and artifact failures still fail this job.\n';
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Preserve browser audit evidence
        id: browser-evidence
        if: always()
        # Retained release evidence is required. Preserve upload failures as
        # failures so unavailable artifact storage cannot be reported as green CI.
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: output/playwright
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
      - name: Report unavailable browser evidence
        if: always() && steps.browser-evidence.outcome == 'failure'
        run: |
          echo "::error::Required browser audit evidence could not be uploaded; the failed upload keeps this job failing. See the upload step for details."
          echo "Required browser audit evidence upload failed. This job remains failing even if the browser tests passed. Test results remain in workflow logs; see the upload step for the storage/service error." >> "$GITHUB_STEP_SUMMARY"
